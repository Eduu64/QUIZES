<!doctype html>
<html lang="es"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<title>QuizBox</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--fg:#1b1f2a;--mu:#6b7280;--bd:#e3e5ee;--ac:#4f46e5;--acf:#fff;--acs:#eef0ff;--ok:#15803d;--oks:#e6f6ec;--ko:#dc2626;--kos:#fdecec;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--fg:#e8eaf0;--mu:#9aa1b2;--bd:#2a2f3c;--ac:#8b93ff;--acf:#10131c;--acs:#232640;--ok:#4ade80;--oks:#112a1b;--ko:#f87171;--kos:#2d1618}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:var(--acf);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 70px}
.sp{flex:1}
.mu,.sub,.hint{color:var(--mu)}
/* ---------- inicio ---------- */
.top{display:flex;align-items:center;gap:10px;padding:20px 0 12px;flex-wrap:wrap}
h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.4px}
.tree{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:6px;margin-top:6px}
.tree.over{outline:2px dashed var(--ac);outline-offset:2px}
.root{padding:8px 12px;color:var(--mu);font-size:13px;border-radius:10px}
.row{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 6px 6px calc(10px + var(--d,0)*22px);border-radius:10px;cursor:pointer;user-select:none}
.row:hover{background:var(--acs)}
.row.drag{opacity:.35}
.over{outline:2px dashed var(--ac);outline-offset:-2px;background:var(--acs)}
.chev{flex:none;width:0;height:0;border-left:6px solid var(--mu);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.chev.o{transform:rotate(90deg)}.chev.h{visibility:hidden}
.ic{flex:none;font-size:20px}
.n,.t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{flex:1;min-width:0}
.t{flex:1;min-width:0}.t b{display:block}
.t small{display:block;color:var(--mu);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{flex:none;font-size:12px;color:var(--mu);background:var(--bg);border-radius:20px;padding:1px 9px}
.m{flex:none;border:0;background:transparent;color:var(--mu);font-size:22px;line-height:1;padding:6px 12px}
.kids{margin-left:14px;border-left:1px solid var(--bd)}
.empty{color:var(--mu);font-size:13px;cursor:default;min-height:36px}.empty:hover{background:none}
.hint{padding:18px 14px;text-align:center}.hint.s{font-size:12.5px;padding:10px}
/* ---------- test ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd)}
.bar .in{max-width:860px;margin:auto;display:flex;align-items:center;gap:10px;padding:0 14px;height:56px}
.tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.pg{color:var(--mu);font-size:13px;white-space:nowrap}
.ib{padding:6px 12px;font-size:18px;line-height:1.2}
.nav{position:sticky;top:56px;z-index:19;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--bd);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:38px;height:34px;padding:0 8px;border-radius:9px;font-size:13px}
.chip.on{background:var(--acs);border-color:var(--ac)}
.chip.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.chip.ko{background:var(--kos);border-color:var(--ko);color:var(--ko)}
.chip.cur{box-shadow:0 0 0 2px var(--ac)}
.tools{display:flex;align-items:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.tg{display:flex;align-items:center;gap:6px;cursor:pointer}
.rs{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin:10px 0}
.big{font-size:40px;font-weight:800;line-height:1;color:var(--ac)}.big small{font-size:18px;color:var(--mu);font-weight:600}
.det{flex:1}.det .acts{margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:12px 0;scroll-margin-top:112px}
.card.good{border-color:var(--ok)}.card.bad{border-color:var(--ko)}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.num{background:var(--ac);color:var(--acf);font-weight:700;font-size:13px;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;padding:0 6px}
.tag{font-size:12px;color:var(--mu);background:var(--bg);border-radius:20px;padding:2px 10px}
.eye{padding:6px 10px;display:grid;place-items:center}.eye.on{color:var(--ac);border-color:var(--ac);background:var(--acs)}
.qt{font-weight:600;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.op{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;margin:8px 0;cursor:pointer;overflow-wrap:anywhere}
.op:hover{border-color:var(--ac)}
.op input{position:absolute;opacity:0;pointer-events:none}
.k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:12px}
.op.s{border-color:var(--ac);background:var(--acs)}
.op.ok{border-color:var(--ok);background:var(--oks)}
.op.ko{border-color:var(--ko);background:var(--kos)}
.op.ok .k{background:var(--ok);color:var(--acf)}.op.ko .k{background:var(--ko);color:#fff}
.chk{margin-top:4px}
.ex{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--ac);background:var(--acs);border-radius:8px;font-size:14px}
.ex.v{display:block}
/* ---------- diálogos ---------- */
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--fg);padding:18px;width:min(92vw,460px);max-height:86vh;overflow:auto}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 10px;font-size:17px;overflow-wrap:anywhere}
.mi{display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px}.mi.dg{color:var(--ko)}
select,textarea,input[type=file]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:6px 0 10px}
textarea{min-height:130px;resize:vertical;font:12px ui-monospace,monospace}
.lb{font-size:13px;color:var(--mu)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.er{color:var(--ko);font-size:13px;margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw;text-align:center}
#toast.v{opacity:1}
@media(max-width:600px){
  dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:18px 18px 0 0}
  .cnt,.sub{display:none}
  .card{padding:14px;margin:10px 0}
  .big{font-size:32px}
}
</style>
<div id="app"></div><div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const enc=encodeURIComponent;
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw Error((await r.text()).trim()||'Error '+r.status);return r.status==204?null:r.json()};
const par=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'';
const bn=p=>p.slice(p.lastIndexOf('/')+1);
const nm=p=>bn(p).replace(/\.json$/,'');
const sub=(d,n)=>(d?d+'/':'')+n;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('v');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('v'),3500)};
const run=async f=>{try{await f();await home()}catch(e){toast(e.message)}};
const dlg=document.createElement('dialog');document.body.append(dlg);
const sheet=(h,p,d)=>{dlg.innerHTML=h;dlg._p=p;dlg._d=d;if(!dlg.open)dlg.showModal()};
let T=null,io=null,depth=0,drag=null;

/* ================= INICIO: árbol ================= */
let tree=[],open=new Set(LS.get('qb.open',[]));
const saveOpen=()=>LS.set('qb.open',[...open]);
const dirs=()=>tree.filter(e=>e.dir).map(e=>e.path).sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
async function home(){tree=await api('/api/tree');draw()}

function draw(){
  io&&io.disconnect();T=null;document.title='QuizBox';
  const kids={},cnt={};
  for(const e of tree){(kids[par(e.path)]??=[]).push(e);if(!e.dir)for(let p=par(e.path);;p=par(p)){cnt[p]=(cnt[p]||0)+1;if(!p)break}}
  const srt=a=>a.sort((x,y)=>(y.dir-x.dir)||bn(x.path).localeCompare(bn(y.path),'es',{numeric:true,sensitivity:'base'}));
  const rows=(p,d)=>srt(kids[p]||[]).map(e=>{
    const a=E(e.path);
    if(e.dir){const o=open.has(e.path);
      return `<div class="row f" draggable="true" data-p="${a}" style="--d:${d}"><i class="chev${o?' o':''}"></i><span class="ic">${o?'📂':'📁'}</span><b class="n">${E(bn(e.path))}</b><span class="cnt">${cnt[e.path]||0}</span><button class="m" aria-label="Opciones">⋯</button></div>`
        +(o?`<div class="kids">${kids[e.path]?rows(e.path,d+1):'<div class="row empty">Carpeta vacía</div>'}</div>`:'')}
    return `<div class="row q" draggable="true" data-p="${a}" style="--d:${d}"><i class="chev h"></i><span class="ic">📝</span><div class="t"><b>${E(e.title||nm(e.path))}</b><small>${E(bn(e.path))} · ${e.n||'?'} preguntas</small></div><button class="m" aria-label="Opciones">⋯</button></div>`}).join('');
  app.innerHTML=`<div class="wrap"><header class="top"><h1>QuizBox</h1><span class="sub">${cnt['']||0} tests</span><span class="sp"></span><button data-a="nf">+ Carpeta</button><button class="p" data-a="add">Añadir tests</button></header>
<div class="tree"><div class="root" data-p="">📂 Inicio</div>${tree.length?rows('',0):'<div class="hint">Aún no hay tests.<br>Arrastra aquí tus archivos <b>.json</b> o pulsa <b>Añadir tests</b>.</div>'}</div>
<p class="hint s">Arrastra tests o carpetas dentro de otras carpetas · «⋯» para renombrar, mover o borrar</p></div>`;
}

/* ---- acciones sobre carpetas / tests ---- */
function remap(a,b){const n=new Set();for(const o of open)n.add(o===a?b:o.startsWith(a+'/')?b+o.slice(a.length):o);open=n;saveOpen();
  const v=LS.get('qb:'+a);if(v){LS.set('qb:'+b,v);LS.del('qb:'+a)}}
async function move(from,to){await api(`/api/move?from=${enc(from)}&to=${enc(to)}`,{method:'POST'});remap(from,to)}
async function mv(from,toDir){const to=sub(toDir,bn(from));if(to===from)return;await move(from,to);if(toDir){open.add(toDir);saveOpen()}}
const canDrop=(src,to)=>to!==par(src)&&to!==src&&!to.startsWith(src+'/');
function newFolder(dir){const n=(prompt('Nombre de la carpeta')||'').trim().replace(/[\\/]+/g,'-');if(!n)return;
  run(async()=>{await api('/api/folder?path='+enc(sub(dir,n)),{method:'POST'});if(dir){open.add(dir);saveOpen()}})}
function rename(p,d){let n=(prompt('Nuevo nombre',d?bn(p):nm(p))||'').trim().replace(/[\\/]+/g,'-');if(!n)return;
  const to=sub(par(p),n+(d?'':'.json'));if(to!==p)run(()=>move(p,to))}
function menu(p,d){
  sheet(`<h3>${d?'📁':'📝'} ${E(d?bn(p):nm(p))}</h3>${d?'<button class="mi" data-m="up">Añadir tests aquí</button><button class="mi" data-m="nf">Nueva subcarpeta</button>':''}<button class="mi" data-m="rn">Renombrar</button><button class="mi" data-m="mv">Mover a…</button><button class="mi dg" data-m="rm">Borrar</button>`,p,d)}
function moveDlg(p,d){
  const ok=x=>!(d&&(x===p||x.startsWith(p+'/')));
  sheet(`<h3>Mover «${E(d?bn(p):nm(p))}» a…</h3>`+['',...dirs()].filter(ok).map(x=>`<button class="mi" data-m="to" data-t="${E(x)}"${x===par(p)?' disabled':''}>${x?'\u2003'.repeat(x.split('/').length-1)+'📁 '+E(bn(x)):'📂 Inicio'}</button>`).join(''),p,d)}

/* ---- añadir tests (archivos .json o texto pegado) ---- */
function addDlg(dir){
  sheet(`<h3>Añadir tests</h3><label class="lb">Carpeta de destino<select id="dst">${['',...dirs()].map(x=>`<option value="${E(x)}"${x===dir?' selected':''}>${x?'\u2003'.repeat(x.split('/').length-1)+E(bn(x)):'Inicio'}</option>`).join('')}</select></label>
<label class="lb">Archivos .json (puedes elegir varios)<input type="file" id="fi" multiple accept=".json,application/json"></label>
<label class="lb">…o pega un JSON<textarea id="tx" placeholder='{"title":"…","questions":[…]}'></textarea></label>
<div id="log"></div><div class="acts"><button data-m="cancel">Cancelar</button><button class="p" data-m="go">Añadir</button></div>`)}
async function upload(items,dir){
  let ok=0;const err=[],taken=new Set(tree.map(e=>e.path));
  for(const it of items){try{
    let n=it.n;if(!n){n=String(JSON.parse(it.t).title||'quiz').replace(/[\\/:*?"<>|]+/g,'-').trim().slice(0,80)}
    n=n.replace(/\.json$/i,'');let p=sub(dir,n+'.json'),i=2;while(taken.has(p))p=sub(dir,`${n} (${i++}).json`);
    await api('/api/quiz?path='+enc(p),{method:'PUT',body:it.t});taken.add(p);ok++}
  catch(e){err.push((it.n||'JSON pegado')+': '+e.message)}}
  return{ok,err}}
async function doAdd(){
  const dir=$('#dst').value,tx=$('#tx').value.trim(),log=$('#log'),items=[];
  for(const f of $('#fi').files)items.push({n:f.name,t:await f.text()});
  if(tx)items.push({n:'',t:tx});
  if(!items.length){log.innerHTML='<div class="er">Elige archivos .json o pega uno.</div>';return}
  log.textContent='Añadiendo…';
  const r=await upload(items,dir);
  if(dir){open.add(dir);saveOpen()}
  await home();
  if(r.err.length)log.innerHTML=r.err.map(x=>`<div class="er">${E(x)}</div>`).join('');
  else{dlg.close();toast(`${r.ok} test${r.ok>1?'s añadidos':' añadido'}`)}}

dlg.addEventListener('click',e=>{
  if(e.target===dlg)return dlg.close();
  const b=e.target.closest('[data-m]');if(!b)return;
  const m=b.dataset.m,p=dlg._p,d=dlg._d;
  if(m==='go')return doAdd().catch(x=>toast(x.message));
  if(m==='mv')return moveDlg(p,d);
  dlg.close();
  if(m==='up')addDlg(p);else if(m==='nf')newFolder(p);else if(m==='rn')rename(p,d);
  else if(m==='to')run(()=>mv(p,b.dataset.t));
  else if(m==='rm'&&confirm(d?'¿Borrar la carpeta y TODO lo que contiene?':'¿Borrar este test?'))run(()=>api((d?'/api/folder':'/api/quiz')+'?path='+enc(p),{method:'DELETE'}));
});

/* ---- arrastrar y soltar (mover dentro de la app / soltar .json del ordenador) ---- */
const clr=()=>document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
document.addEventListener('dragstart',e=>{const r=e.target.closest?.('.row.f,.row.q');if(!r)return;drag=r.dataset.p;e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move';r.classList.add('drag')});
document.addEventListener('dragend',()=>{drag=null;clr();document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'))});
document.addEventListener('dragover',e=>{
  const dt=e.dataTransfer,fl=dt&&[...dt.types].includes('Files');if(!fl&&drag==null)return;
  e.preventDefault();clr();
  const r=e.target.closest?.('.row.f,.root');
  if(r&&(fl||canDrop(drag,r.dataset.p)))r.classList.add('over');else if(fl&&$('.tree'))$('.tree').classList.add('over')});
document.addEventListener('drop',async e=>{
  const dt=e.dataTransfer;if(!dt)return;const files=[...dt.files],r=e.target.closest?.('.row.f,.root');
  if(files.length){e.preventDefault();clr();if(!$('.tree'))return;
    const js=files.filter(f=>/\.json$/i.test(f.name));if(!js.length)return toast('Solo se admiten archivos .json');
    const dir=r?r.dataset.p:'',items=[];for(const f of js)items.push({n:f.name,t:await f.text()});
    const x=await upload(items,dir);if(dir){open.add(dir);saveOpen()}await home();
    return toast(x.err.length?x.err[0]:`${x.ok} test${x.ok>1?'s añadidos':' añadido'}`)}
  if(drag!=null&&r){e.preventDefault();clr();const to=r.dataset.p,src=drag;drag=null;if(canDrop(src,to))run(()=>mv(src,to))}});

/* ================= TEST: todas las preguntas con scroll ================= */
const EYE='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const same=(a,b)=>a.length===b.length&&b.every(x=>a.includes(x));
const card=(q,i)=>{const multi=T.k[i].length>1;
  return `<section class="card" id="q${i}" data-i="${i}"><div class="qh"><span class="num">${i+1}</span>${multi?'<span class="tag">Varias correctas</span>':''}<span class="sp"></span><button class="ib eye" data-a="eye" aria-label="Ver respuesta" title="Ver respuesta">${EYE}</button></div><div class="qt">${E(String(q.q).replace(/^\d+\.\s+/,''))}</div><div class="ops">${q.options.map((o,j)=>`<label class="op"><input type="${multi?'checkbox':'radio'}" name="q${i}" value="${j}"><span class="k">${String.fromCharCode(65+j)}</span><span>${E(o)}</span></label>`).join('')}</div>${multi?'<button class="chk" data-a="chk">Comprobar</button>':''}<div class="ex"></div></section>`};

async function openTest(p){
  const d=await api('/api/quiz?path='+enc(p)),sv=LS.get('qb:'+p,{}),N=d.questions.length;
  io&&io.disconnect();
  T={p,d,N,eye:new Set(),f:null,inst:LS.get('qb.inst',false),
    k:d.questions.map(q=>[].concat(q.answer)),
    a:d.questions.map((q,i)=>(sv.a?.[i]||[]).filter(x=>x<q.options.length)),
    c:d.questions.map((_,i)=>!!sv.c?.[i])};
  document.title=d.title;
  app.innerHTML=`<div class="bar"><div class="in"><button class="ib" data-a="back" aria-label="Volver">‹</button><b class="tt">${E(d.title)}</b><span class="pg" id="pg"></span><button class="p" data-a="grade">Corregir</button></div></div>
<nav class="nav" id="nav">${d.questions.map((_,i)=>`<button class="chip" id="n${i}" data-n="${i}">${i+1}</button>`).join('')}</nav>
<div class="wrap"><div id="res"></div><div id="qs">${d.questions.map(card).join('')}</div></div>`;
  for(let i=0;i<N;i++)paint(i);result();scrollTo(0,0);
  const nav=$('#nav');
  io=new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting){
    document.querySelectorAll('.chip.cur').forEach(c=>c.classList.remove('cur'));
    const c=$('#n'+x.target.dataset.i);c.classList.add('cur');nav.scrollLeft=c.offsetLeft-nav.clientWidth/2+c.offsetWidth/2}},{rootMargin:'-35% 0px -60% 0px'});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}
const save=()=>LS.set('qb:'+T.p,{a:T.a,c:T.c});
const score=()=>T.c.reduce((s,g,i)=>s+(g&&same(T.a[i],T.k[i])?1:0),0);
function paint(i){
  const c=$('#q'+i),k=T.k[i],a=T.a[i],g=T.c[i],v=g||T.eye.has(i),ok=g&&same(a,k);
  c.querySelectorAll('.op').forEach((l,j)=>{const s=a.includes(j),inp=l.firstChild;inp.checked=s;inp.disabled=g;
    l.className='op'+(s?' s':'')+(v&&k.includes(j)?' ok':'')+(g&&s&&!k.includes(j)?' ko':'')});
  c.classList.toggle('good',ok);c.classList.toggle('bad',g&&!ok);
  c.querySelector('.eye').classList.toggle('on',T.eye.has(i));
  const q=T.d.questions[i],ex=c.querySelector('.ex');ex.textContent=q.explanation||'';ex.classList.toggle('v',!!q.explanation&&v);
  const ck=c.querySelector('.chk');if(ck)ck.hidden=g;
  const n=$('#n'+i).classList;n.remove('on','ok','ko');if(g)n.add(ok?'ok':'ko');else if(a.length)n.add('on');
  prog()}
function prog(){const g=T.c.filter(Boolean).length;$('#pg').textContent=g===T.N?`${score()}/${T.N} ✓`:`${T.a.filter(x=>x.length).length}/${T.N}`}
function result(){
  const N=T.N;let bl=0,done=0;T.c.forEach((g,i)=>{if(g){done++;if(!T.a[i].length)bl++}});
  const ok=score();
  let h=`<div class="tools"><label class="tg"><input type="checkbox" id="inst"${T.inst?' checked':''}> Corrección inmediata</label><span class="sp"></span>${T.f?'<button data-a="all">Ver todas</button>':''}<button data-a="reset">Reiniciar</button></div>`;
  if(done===N)h+=`<div class="rs"><div class="big">${ok}<small>/${N}</small></div><div class="det"><b>${Math.round(ok/N*100)}%</b> · ${N-ok-bl} falladas · ${bl} en blanco${N-ok?'<div class="acts"><button class="p" data-a="redo">Repetir falladas</button></div>':''}</div></div>`;
  $('#res').innerHTML=h}
function focus(){for(let i=0;i<T.N;i++){const h=!!T.f&&!T.f.has(i);$('#q'+i).hidden=h;$('#n'+i).hidden=h}}
function grade(i){T.c[i]=true;save();paint(i);result()}
function gradeAll(){T.c=T.c.map(()=>true);save();for(let i=0;i<T.N;i++)paint(i);result();scrollTo({top:0,behavior:'smooth'})}
function redo(){const f=new Set();T.c.forEach((_,i)=>{if(!same(T.a[i],T.k[i])){f.add(i);T.a[i]=[];T.c[i]=false;T.eye.delete(i)}});
  T.f=f;save();focus();for(let i=0;i<T.N;i++)paint(i);result();scrollTo(0,0)}
function reset(){if(!confirm('¿Borrar tus respuestas de este test?'))return;
  T.a=T.a.map(()=>[]);T.c=T.c.map(()=>false);T.eye.clear();T.f=null;LS.del('qb:'+T.p);focus();for(let i=0;i<T.N;i++)paint(i);result();scrollTo(0,0)}

app.addEventListener('change',e=>{
  const t=e.target;if(!T)return;
  if(t.id==='inst'){T.inst=t.checked;LS.set('qb.inst',T.inst);return}
  const c=t.closest('.card');if(!c)return;
  const i=+c.dataset.i,multi=T.k[i].length>1;
  T.a[i]=multi?[...c.querySelectorAll('input:checked')].map(x=>+x.value):[+t.value];
  save();paint(i);if(T.inst&&!multi)grade(i)});

const ACT={
  nf:()=>newFolder(''),add:()=>addDlg(''),
  back:()=>depth?history.back():location.replace('#'),
  grade:gradeAll,redo,reset,
  all:()=>{T.f=null;focus();result()},
  eye:b=>{const i=+b.closest('.card').dataset.i;T.eye.has(i)?T.eye.delete(i):T.eye.add(i);paint(i)},
  chk:b=>grade(+b.closest('.card').dataset.i)};
app.addEventListener('click',e=>{
  const t=e.target,a=t.closest('[data-a]');
  if(a){ACT[a.dataset.a]?.(a);return}
  const n=t.closest('.chip');if(n){$('#q'+n.dataset.n).scrollIntoView({behavior:'smooth',block:'start'});return}
  const m=t.closest('.m');if(m){const r=m.closest('.row');menu(r.dataset.p,r.classList.contains('f'));return}
  const r=t.closest('.row.f,.row.q');if(!r)return;
  if(r.classList.contains('f')){const p=r.dataset.p;open.has(p)?open.delete(p):open.add(p);saveOpen();draw()}
  else{depth=1;location.hash='t/'+enc(r.dataset.p)}});

async function route(){
  const h=location.hash;
  try{if(h.startsWith('#t/'))await openTest(decodeURIComponent(h.slice(3)));else await home()}catch(e){toast(e.message);if(h)location.replace('#')}}
addEventListener('hashchange',route);route();
</script>
</html>
