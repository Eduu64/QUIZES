services:
  quizbox:
    build: .
    container_name: quizbox
    restart: unless-stopped
    ports:
      - "8080:8080"          # mejor: "192.168.1.50:8080:8080" (IP LAN de tu servidor)
    volumes:
      - ./data:/data         # tus tests: carpeta normal del host, PERSISTENTE
                             # (sobrevive a reconstruir, actualizar o borrar el contenedor)
      # Alternativa: volumen gestionado por Docker (comenta la línea de arriba y descomenta esta)
      # - quizbox-data:/data
    environment:
      - TZ=Europe/Madrid
    mem_limit: 64m           # único límite que mantiene: consumo mínimo de RAM
